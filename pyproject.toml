[project]
name = "stt-api"
version = "0.2.0"
description = "OpenAI-compatible STT API server backed by faster-whisper"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "faster-whisper>=0.10.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "wyoming>=1.8.0",
    "zeroconf>=0.132.0",
]

[project.optional-dependencies]
# CUDA 12 user-space libraries for CTranslate2's GPU backend. Installed only by
# the GPU image (deploy/Dockerfile.gpu, `uv sync --extra gpu`); the default CPU
# image must stay CUDA-free. CTranslate2 4.8.2 is built against CUDA 12.4 and
# loads cuBLAS at runtime; cuDNN became optional in CT2 4.6.3 (conv1d is now
# pure CUDA), so the wheel links no cuDNN at all. Driver >= 525.60.13 is still
# required for the CUDA 12 runtime (see README "GPU image (CUDA)").
gpu = [
    "nvidia-cublas-cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.scripts]
stt-api = "stt_api.main:main"
# One-release migration aid for existing scripts; remove in the next minor.
whisper-api = "stt_api.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
# Installable package (stt_api → stt_api). Docker still uses
# --no-install-project and copies the source tree.
package = true

[tool.hatch.build.targets.wheel]
packages = ["stt_api"]

[tool.fastapi]
entrypoint = "stt_api.main:app"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.pyright]
venvPath = "."
venv = ".venv"
