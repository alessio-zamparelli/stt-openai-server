[project]
name = "stt-api"
version = "0.2.0"
description = "OpenAI-compatible STT API server backed by faster-whisper"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "faster-whisper>=0.10.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "wyoming>=1.8.0",
    "zeroconf>=0.132.0",
]

[project.scripts]
stt-api = "stt_api.main:main"
# One-release migration aid for existing scripts; remove in the next minor.
whisper-api = "stt_api.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
# Installable package (stt_api → stt_api). Docker still uses
# --no-install-project and copies the source tree.
package = true

[tool.hatch.build.targets.wheel]
packages = ["stt_api"]

[tool.fastapi]
entrypoint = "stt_api.main:app"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.pyright]
venvPath = "."
venv = ".venv"
