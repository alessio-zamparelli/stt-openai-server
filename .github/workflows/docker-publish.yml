name: Deploy container to GHCR

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate: only publish a container if the app still imports and the
  # OpenAPI schema generates cleanly (no external calls, no model download).
  smoke-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Sync environment from lockfile
        run: uv sync --locked --no-install-project

      - name: Import check + OpenAPI schema
        run: |
          uv run python - <<'EOF'
          from fastapi.openapi.utils import get_openapi
          import app
          schema = get_openapi(title="whisper-api", version="0.1.0", routes=app.app.routes)
          expected = {
              "/v1/audio/transcriptions",
              "/v1/audio/translations",
              "/v1/models",
              "/health",
          }
          missing = expected - set(schema.get("paths", {}))
          assert not missing, f"missing routes: {missing}"
          assert app.settings.model_name == "base"
          assert app.settings.compute_type == "int8"
          print("smoke test OK:", sorted(expected))
          EOF

  build-and-push:
    runs-on: ubuntu-latest
    needs: smoke-test
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
