name: Deploy container to GHCR

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pin the runner image: ubuntu-latest migrates to Ubuntu 26.04 starting
  # 2026-10-19. Stay on 24.04 until the image change is validated, so builds
  # do not pick up a new Docker/OS stack implicitly.
  # Fast gate: only publish a container if the app still imports and the
  # OpenAPI schema generates cleanly (no external calls, no model download).
  smoke-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.1"
          enable-cache: true

      - name: Sync environment from lockfile
        run: uv sync --locked --no-install-project

      - name: Import check + OpenAPI schema
        run: |
          uv run python - <<'EOF'
          from fastapi.openapi.utils import get_openapi
          import app
          import stt_api.main
          import stt_api.services.wyoming
          schema = get_openapi(
              title="stt-api", version=stt_api.main.__version__,
              routes=stt_api.main.app.routes,
          )
          expected = {
              "/v1/audio/transcriptions",
              "/v1/audio/translations",
              "/v1/models",
              "/health",
          }
          missing = expected - set(schema.get("paths", {}))
          assert not missing, f"missing routes: {missing}"
          assert stt_api.main.runtime.settings.model_name == "base"
          assert stt_api.main.runtime.settings.compute_type == "int8"
          assert app.app is stt_api.main.app
          print("smoke test OK:", sorted(expected))
          EOF

  # Publish the opt-in CUDA image alongside the CPU image, to the same GHCR
  # package but with a `-cuda` tag suffix:
  #   v1.2.3 tag push -> 1.2.3-cuda (+ 1.2-cuda)
  #   main push       -> latest-cuda
  # Both jobs build linux/amd64 in parallel; distinct tags, no manifest clash.
  build-and-push-cuda:
    runs-on: ubuntu-24.04
    needs: smoke-test
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (CUDA tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Never emit a bare `latest`: on a tag push, type=semver would
          # otherwise add `latest` and clobber the CPU image's tag.
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest-cuda,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}-cuda
            type=semver,pattern={{major}}.{{minor}}-cuda

      - name: Build and push CUDA image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.gpu
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=gpu
          cache-to: type=gha,mode=max,scope=gpu

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  build-and-push:
    runs-on: ubuntu-24.04
    needs: smoke-test
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
